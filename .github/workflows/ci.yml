name: CI

# Every push and pull request: static analysis, engine tests, app tests
# (including the screen smoke tests) and a debug Android build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/sibot_engine && dart pub get)

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/sibot_engine/lib packages/sibot_engine/test

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/sibot_engine && dart analyze --fatal-infos)

      - name: Engine tests
        working-directory: packages/sibot_engine
        run: dart test

      - name: App tests
        run: flutter test

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build apk --debug
