name: Release

# Push a version tag (e.g. v0.2.0) to publish a GitHub release with the
# signed Android APKs (one per ABI and a universal one), the App Bundle
# for Google Play, the web build and SHA-256 checksums.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SIBOT_KEYSTORE_BASE64    base64 of android/upload-keystore.jks
#   SIBOT_KEYSTORE_PASSWORD  keystore password
#   SIBOT_KEY_PASSWORD       key password
#   SIBOT_KEY_ALIAS          key alias (upload)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          (cd packages/sibot_engine && dart pub get && dart analyze --fatal-infos && dart test)
          flutter analyze
          flutter test

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from the tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not vMAJOR.MINOR.PATCH" >&2; exit 1
          fi
          # Monotonic build number for Play: 10000·major + 100·minor + patch,
          # times 100 plus the run attempt.
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( (MA * 10000 + MI * 100 + PA) * 100 + ${{ github.run_attempt }} ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIBOT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIBOT_KEYSTORE_BASE64 is not set: refusing to publish an unsigned release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIBOT_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build Android
        env:
          SIBOT_KEYSTORE_PASSWORD: ${{ secrets.SIBOT_KEYSTORE_PASSWORD }}
          SIBOT_KEY_PASSWORD: ${{ secrets.SIBOT_KEY_PASSWORD }}
          SIBOT_KEY_ALIAS: ${{ secrets.SIBOT_KEY_ALIAS }}
        run: |
          flutter pub get
          ARGS="--release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}"
          flutter build apk $ARGS --split-per-abi
          flutter build apk $ARGS
          flutter build appbundle $ARGS

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "The APK is signed with the debug key." >&2; exit 1
          fi

      - name: Build web
        run: flutter build web --release --base-href /sibot/

      - name: Collect artifacts
        run: |
          V=${{ steps.version.outputs.name }}
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/sibot-$V.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/sibot-$V-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/sibot-$V.aab"
          (cd build/web && zip -qr "../../dist/sibot-$V-web.zip" .)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sibot ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/*
